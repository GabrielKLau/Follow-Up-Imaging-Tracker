name: LegiScan attribution check

on:
  push:
    paths:
      - "docs/**/*.html"
      - "pipeline/check_attribution.py"
  pull_request:
    paths:
      - "docs/**/*.html"
      - "pipeline/check_attribution.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python pipeline/check_attribution.py
